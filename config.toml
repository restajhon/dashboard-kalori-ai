[theme]
# Warna hijau terang (meniru warna grafik dan ikon di gambar)
primaryColor = "#2ECC71"

# Warna latar belakang utama (putih sedikit abu-abu agar bersih)
backgroundColor = "#F8F9FA"

# Warna latar belakang sidebar (Hijau gelap/Teal meniru sisi kiri gambar)
secondaryBackgroundColor = "#0F3D35"

# Warna teks utama di area putih (Hitam keabu-abuan)
textColor = "#1E1E1E"

# Font yang modern
font = "sans serif"